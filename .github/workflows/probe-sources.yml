name: Probe data sources

# Phase 1: check which sports data sources are reachable from GitHub Actions runners.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/probe-sources.ts
      - .github/workflows/probe-sources.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-sources.ts probe-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: probe-report
          path: probe-report.md
