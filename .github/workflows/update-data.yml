name: Update data

on:
  schedule:
    # Every team's schedule, standings, head-to-head, injuries and previews, plus player stats
    # for the 5 teams refreshed longest ago (each team comes round about every 6 hours).
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      all_players:
        description: Refresh player stats for every team (about 45 minutes in season)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Fetch data
        id: ingest
        continue-on-error: true
        env:
          ALL_PLAYERS: ${{ github.event_name == 'workflow_dispatch' && inputs.all_players }}
          # Optional: previews are skipped when the secret isn't set.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/ingest.ts --players ${{ env.ALL_PLAYERS == 'true' && 'all' || '' }}

      - name: Commit changes
        run: |
          git add public/data data/cache
          # meta.json changes on every run; only commit when real data changed.
          if git diff --cached --quiet -- . ':!public/data/meta.json'; then
            echo "No data changes"
            exit 0
          fi
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git commit -m "Update data"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Report ingest failure
        if: steps.ingest.outcome == 'failure'
        run: |
          echo "::error::Part of the data refresh failed; see the Fetch data step. Previous files were kept for those parts."
          exit 1
